name: Organize LeetHub Submissions

on:
  push:
    branches:
      - main

jobs:
  organize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Merge and Keep Multiple Approaches
        run: |
          mkdir -p solutions
          moved=0
          
          for folder in [0-9]*/; do
            if [ -d "$folder" ]; then
              target="solutions/${folder}"
              mkdir -p "$target"
              
              # Check each file inside the new LeetHub folder
              for file in "$folder"*; do
                if [ -f "$file" ]; then
                  filename=$(basename "$file")
                  
                  # If it's a README, just overwrite the old one to keep the stats updated
                  if [[ "$filename" == *.md ]]; then
                    mv "$file" "$target"
                  else
                    # If it's a code file and already exists, rename it to keep both
                    if [ -f "${target}${filename}" ]; then
                      timestamp=$(date +%s)
                      name="${filename%.*}"
                      ext="${filename##*.}"
                      mv "$file" "${target}${name}_${timestamp}.${ext}"
                    else
                      # If it's the first time solving it, just move it normally
                      mv "$file" "$target"
                    fi
                  fi
                fi
              done
              
              # Delete the empty root folder
              rm -rf "$folder"
              moved=1
            fi
          done
          
          if [ $moved -eq 1 ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "chore: save new approach to solutions folder"
            git push
          fi
