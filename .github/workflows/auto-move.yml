name: Organize LeetHub Submissions

on:
  push:
    branches:
      - main

jobs:
  organize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Move Problem Folders to solutions/
        run: |
          # Ensure solutions directory exists
          mkdir -p solutions
          moved=0
          
          # Find any folder starting with a number (LeetHub naming convention)
          for folder in [0-9]*/; do
            if [ -d "$folder" ]; then
              mv "$folder" solutions/
              moved=1
            fi
          done
          
          # If folders were moved, commit and push the changes back
          if [ $moved -eq 1 ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "chore: auto-move LeetHub problem to solutions folder"
            git push
          fi
