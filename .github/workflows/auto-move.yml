name: Organize LeetHub Submissions

on:
  push:
    branches:
      - main

jobs:
  organize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Smart Merge (Keep Unique Approaches, Discard Duplicates)
        run: |
          mkdir -p solutions
          moved=0
          
          for folder in [0-9]*/; do
            if [ -d "$folder" ]; then
              target="solutions/${folder}"
              mkdir -p "$target"
              
              # Process each file inside the new LeetHub folder
              for file in "$folder"*; do
                if [ -f "$file" ]; then
                  filename=$(basename "$file")
                  
                  # 1. Always update the README with the latest runtime stats
                  if [[ "$filename" == *.md ]]; then
                    mv "$file" "$target"
                  else
                    # 2. Check if this exact code already exists in any file
                    is_duplicate=0
                    for existing_file in "${target}"*; do
                      if [ -f "$existing_file" ] && [[ "$existing_file" != *.md ]]; then
                        if cmp -s "$file" "$existing_file"; then
                          is_duplicate=1
                          break
                        fi
                      fi
                    done
                    
                    if [ $is_duplicate -eq 1 ]; then
                      # 3. Code matches an existing approach perfectly; throw it away
                      rm "$file"
                    elif [ -f "${target}${filename}" ]; then
                      # 4. Code is entirely new, but filename exists; save as a new approach
                      timestamp=$(date +%s)
                      name="${filename%.*}"
                      ext="${filename##*.}"
                      mv "$file" "${target}${name}_${timestamp}.${ext}"
                    else
                      # 5. First time solving; move normally
                      mv "$file" "$target"
                    fi
                  fi
                fi
              done
              
              # Clean up the empty folder LeetHub left behind
              rm -rf "$folder"
              moved=1
            fi
          done
          
          # Only commit if changes were actually made to prevent Git errors
          if [ $moved -eq 1 ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            if ! git diff-index --quiet HEAD; then
              git commit -m "chore: sync LeetHub submissions"
              git push
            fi
          fi
